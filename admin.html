<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>لوحة تحكم موقع ITQAN</title>
<meta name="robots" content="noindex,nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Cairo',sans-serif;}
body{background:#f1f5f9;}

.lbl{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:6px;}

.tab:hover{background:#e2e8f0;}
.tab.on{background:#0f172a;color:#fff;}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin-bottom:16px;}
.btn{border-radius:10px;font-weight:700;font-size:14px;padding:10px 18px;transition:.15s;}
.btn-a{background:#f59e0b;color:#0f172a;}.btn-a:hover{background:#d97706;}
.btn-d{background:#0f172a;color:#fff;}.btn-d:hover{background:#1e293b;}
.btn-g{background:#e2e8f0;color:#334155;}.btn-g:hover{background:#cbd5e1;}
.btn-r{background:#fee2e2;color:#b91c1c;}.btn-r:hover{background:#fecaca;}

</head>
<body>

<header class="bg-slate-900 text-white sticky top-0 z-40 shadow-lg">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <span class="w-9 h-9 bg-amber-400 text-slate-900 rounded-lg grid place-items-center font-black">IT</span>
      <div>
        <div class="font-black leading-tight">لوحة تحكم الموقع</div>
        <div class="text-[11px] text-white/50" id="draftNote">—</div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="resetDraft()" class="btn btn-g hidden sm:inline-block">تراجع عن كل التعديلات</button>
      <button onclick="publish()" class="btn btn-a">حفظ وتنزيل الملفات</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-[210px_1fr] gap-6">
  <nav id="tabs" class="space-y-1 lg:sticky lg:top-24 self-start bg-white rounded-2xl p-3 border border-slate-200"></nav>
  <section id="panel"></section>
</main>

<div id="toast" class="fixed bottom-6 right-6 z-50 hidden bg-slate-900 text-white text-sm font-bold px-5 py-3 rounded-xl shadow-xl"></div>

<script src="data.js"></script>
<script>
/* ============ STATE ============ */
var LS = { get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
           set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
           del:function(k){ try{ localStorage.removeItem(k); }catch(e){} } };
var ORIGINAL = JSON.parse(JSON.stringify(window.SITE));
var D = JSON.parse(LS.get('itqan_draft') || 'null') || JSON.parse(JSON.stringify(window.SITE));
var NEW_IMAGES = {};           // filename -> Blob (added this session)
var PREVIEWS   = {};           // filename -> objectURL

function save(){ LS.set('itqan_draft', JSON.stringify(D));
  document.getElementById('draftNote').textContent = 'آخر تعديل: ' + new Date().toLocaleTimeString('ar-EG');
}
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.add('hidden');},2600); }
function resetDraft(){
  if(!confirm('هيتم إلغاء كل التعديلات غير المحفوظة والرجوع لآخر نسخة مرفوعة. تمام؟')) return;
  LS.del('itqan_draft'); D = JSON.parse(JSON.stringify(ORIGINAL)); NEW_IMAGES={}; render();
  toast('رجعنا للنسخة الأصلية');
}
function getP(path){ return path.split('.').reduce(function(o,k){ return o==null?o:o[k]; }, D); }
function setP(path, val){
  var ks=path.split('.'), o=D;
  for(var i=0;i<ks.length-1;i++) o=o[ks[i]];
  o[ks[ks.length-1]]=val; save();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function imgSrc(f){ return PREVIEWS[f] || f; }

/* ============ FIELD BUILDERS ============ */
function fText(path, label, hint){
  return '<div class="mb-4"><label class="lbl">'+esc(label)+(hint?' <span class="font-normal text-slate-400">'+esc(hint)+'</span>':'')+'</label>'+
    '<input class="inp" data-path="'+path+'" value="'+esc(getP(path))+'"/></div>';
}
function fArea(path, label, rows){
  return '<div class="mb-4"><label class="lbl">'+esc(label)+'</label>'+
    '<textarea class="inp resize-y" rows="'+(rows||3)+'" data-path="'+path+'">'+esc(getP(path))+'</textarea></div>';
}
function fSelect(path, label, opts){
  var v=getP(path);
  return '<div class="mb-4"><label class="lbl">'+esc(label)+'</label><select class="inp" data-path="'+path+'">'+
    opts.map(function(o){ return '<option value="'+esc(o[0])+'"'+(String(v)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')+
    '</select></div>';
}
function fImage(path, label){
  var f=getP(path);
  return '<div class="mb-4"><label class="lbl">'+esc(label)+'</label>'+
    '<div class="flex items-center gap-3">'+
      '<img src="'+esc(imgSrc(f))+'" class="w-20 h-20 rounded-xl object-cover border border-slate-200 bg-slate-100" onerror="this.style.opacity=.25"/>'+
      '<div class="flex-1 min-w-0">'+
        '<div class="text-xs text-slate-500 truncate mb-2" dir="ltr">'+esc(f)+(NEW_IMAGES[f]?' <span class="chip">جديدة</span>':'')+'</div>'+
        '<button class="btn btn-g text-xs" onclick="pickImage(\''+path+'\')">تغيير الصورة</button>'+
      '</div>'+
    '</div></div>';
}
/* simple string-array editor */
function fList(path, label, placeholder){
  var arr=getP(path)||[];
  return '<div class="mb-4"><label class="lbl">'+esc(label)+'</label><div class="space-y-2">'+
    arr.map(function(v,i){ return '<div class="flex gap-2">'+
      '<input class="inp" data-path="'+path+'.'+i+'" value="'+esc(v)+'" placeholder="'+esc(placeholder||'')+'"/>'+
      '<button class="btn btn-r px-3" onclick="delItem(\''+path+'\','+i+')">حذف</button></div>'; }).join('')+
    '</div><button class="btn btn-g text-xs mt-2" onclick="addItem(\''+path+'\',\'\')">+ إضافة سطر</button></div>';
}
function addItem(path, val){ getP(path).push(typeof val==='object'?JSON.parse(JSON.stringify(val)):val); save(); render(); }
function delItem(path, i){ if(!confirm('تأكيد الحذف؟')) return; getP(path).splice(i,1); save(); render(); }
function moveItem(path, i, dir){
  var a=getP(path), j=i+dir; if(j<0||j>=a.length) return;
  var t=a[i]; a[i]=a[j]; a[j]=t; save(); render();
}

/* ============ IMAGE PICKER + RESIZE ============ */
function pickImage(path){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=function(){
    var file=inp.files[0]; if(!file) return;
    toast('جاري ضغط الصورة...');
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var maxw=1600, w=im.width, h=im.height;
        if(w>maxw){ h=Math.round(h*maxw/w); w=maxw; }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        c.toBlob(function(blob){
          var name='images/img-'+Date.now()+'.jpg';
          NEW_IMAGES[name]=blob;
          PREVIEWS[name]=URL.createObjectURL(blob);
          setP(path,name); render();
          toast('تم — الصورة اتحفظت باسم '+name.replace('images/',''));
        },'image/jpeg',0.82);
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  };
  inp.click();
}

function addProject(){
  D.gallery.projects.unshift({image:'images/project-01.webp',title:'مشروع جديد',subtitle:'وصف المشروع',status:'done',width:'normal'});
  save(); render();
  setTimeout(function(){ pickImage('gallery.projects.0.image'); }, 150);
}

/* ============ RENDER ============ */
function render(){
  document.getElementById('tabs').innerHTML = TABS.map(function(t){
    return '<button class="tab'+(t[0]===CUR?' on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('');
  document.getElementById('panel').innerHTML = VIEWS[CUR]();
  window.scrollTo({top:0});
}
function go(t){ CUR=t; LS.set('itqan_tab',t); render(); }

document.addEventListener('input', function(e){
  var p=e.target.getAttribute('data-path'); if(!p) return;
  setP(p, e.target.value);
});
document.addEventListener('change', function(e){
  var p=e.target.getAttribute('data-path'); if(!p || e.target.tagName!=='SELECT') return;
  var v=e.target.value;
  setP(p, v==='true'?true : v==='false'?false : v);
  render();
});

/* ============ PUBLISH ============ */
function dl(blob, filename){
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function publish(){
  var js='/* ملف بيانات موقع ITQAN — آخر تحديث: '+new Date().toLocaleString('ar-EG')+' */\n'+
         'window.SITE = '+JSON.stringify(D,null,2)+';\n';
  dl(new Blob([js],{type:'text/javascript;charset=utf-8'}), 'data.js');

  var names=Object.keys(NEW_IMAGES);
  names.forEach(function(n,i){
    setTimeout(function(){ dl(NEW_IMAGES[n], n.replace('images/','')); }, 700*(i+1));
  });

  var msg = names.length
    ? 'نزّلنا لك ملف data.js و'+names.length+' صورة جديدة.\n\nالخطوات:\n1) ارفع data.js في نفس مجلد index.html (استبدل القديم).\n2) ارفع الصور الجديدة جوه مجلد images.\n3) افتح الموقع واعمل تحديث (Ctrl+F5).'
    : 'نزّلنا لك ملف data.js.\n\nارفعه في نفس مجلد index.html مكان القديم، وبعدها افتح الموقع واعمل تحديث (Ctrl+F5).';
  setTimeout(function(){ alert(msg); }, 400);
  toast('تم التنزيل');
}

window.addEventListener('beforeunload', function(e){
  if(Object.keys(NEW_IMAGES).length){ e.preventDefault(); e.returnValue=''; }
});

if(LS.get('itqan_draft')) document.getElementById('draftNote').textContent='فيه تعديلات محفوظة لسه متنزلتش';
else document.getElementById('draftNote').textContent='جاهز';
render();
</script>
</body>
