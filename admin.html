<script>
/* ============ LOGIN GATE ============ */
var AUTH_HASH = '6aef9777e32ab3a056c3b6f7ae72fedda109cb95f454542dbd3126c3063563cc';
var LSg = { get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
            set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
            del:function(k){ try{ localStorage.removeItem(k); }catch(e){} } };
function sha256Hex(str){
  var enc=new TextEncoder().encode(str);
  return crypto.subtle.digest('SHA-256', enc).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  });
}
function showApp(){
  document.getElementById('loginGate').classList.add('hidden');
  document.getElementById('appRoot').classList.remove('hidden');
  if(typeof render==='function' && typeof D!=='undefined') render();
}
function doLogin(e){
  e.preventDefault();
  var u=document.getElementById('loginUser').value.trim();
  var p=document.getElementById('loginPass').value;
  sha256Hex(u+':'+p).then(function(hash){
    if(hash===AUTH_HASH){
      LSg.set('itqan_admin_auth','1');
      document.getElementById('loginErr').classList.add('hidden');
      showApp();
    } else {
      document.getElementById('loginErr').classList.remove('hidden');
    }
  });
  return false;
}
function doLogout(){
  if(!confirm('تسجيل الخروج من لوحة التحكم؟')) return;
  LSg.del('itqan_admin_auth');
  document.getElementById('appRoot').classList.add('hidden');
  document.getElementById('loginGate').classList.remove('hidden');
  document.getElementById('loginUser').value=''; document.getElementById('loginPass').value='';
}
if(LSg.get('itqan_admin_auth')==='1'){ showApp(); }
</script>
<script>
/* ============ STATE ============ */
var LS = { get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
           set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
           del:function(k){ try{ localStorage.removeItem(k); }catch(e){} } };
var ORIGINAL = JSON.parse(JSON.stringify(window.SITE));
var D = JSON.parse(LS.get('itqan_draft') || 'null') || JSON.parse(JSON.stringify(window.SITE));
var NEW_IMAGES = {};           // filename -> Blob (added this session)
var PREVIEWS   = {};           // filename -> objectURL

/* ============ GITHUB CONNECTION (auto-publish) ============ */
var GH = {
  owner:  LS.get('itqan_gh_owner')  || '',
  repo:   LS.get('itqan_gh_repo')   || '',
  branch: LS.get('itqan_gh_branch') || 'main',
  token:  LS.get('itqan_gh_token')  || ''
};
function isGhConnected(){ return !!(GH.owner && GH.repo && GH.token); }
function saveGh(){ LS.set('itqan_gh_owner',GH.owner); LS.set('itqan_gh_repo',GH.repo); LS.set('itqan_gh_branch',GH.branch); LS.set('itqan_gh_token',GH.token); }
function disconnectGh(){
  if(!confirm('هيتم قطع الاتصال بـ GitHub من على الجهاز ده. تمام؟')) return;
  GH={owner:'',repo:'',branch:'main',token:''};
  LS.del('itqan_gh_owner'); LS.del('itqan_gh_repo'); LS.del('itqan_gh_branch'); LS.del('itqan_gh_token');
  render();
}
function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(m,p1){ return String.fromCharCode('0x'+p1); }));
}
function blobToBase64(blob){
  return new Promise(function(resolve,reject){
    var r=new FileReader();
    r.onload=function(){ resolve(r.result.split(',')[1]); };
    r.onerror=reject;
    r.readAsDataURL(blob);
  });
}
function ghApiUrl(path){ return 'https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+path; }
function ghGetFile(path){
  return fetch(ghApiUrl(path)+'?ref='+encodeURIComponent(GH.branch), {
    headers:{ 'Authorization':'token '+GH.token, 'Accept':'application/vnd.github+json' }
  }).then(function(res){
    if(res.status===404) return null;
    if(!res.ok) return res.text().then(function(t){ throw new Error('تعذّر قراءة '+path+' ('+res.status+')'); });
    return res.json();
  });
}
function ghPutRaw(path, base64Content, message, sha){
  var body={ message:message, content:base64Content, branch:GH.branch };
  if(sha) body.sha=sha;
  return fetch(ghApiUrl(path), {
    method:'PUT',
    headers:{ 'Authorization':'token '+GH.token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  }).then(function(res){
    if(!res.ok) return res.text().then(function(t){ throw new Error('تعذّر حفظ '+path+' ('+res.status+')'); });
    return res.json();
  });
}
function connectGh(){
  var owner=document.getElementById('ghOwner').value.trim();
  var repo=document.getElementById('ghRepo').value.trim();
  var branch=document.getElementById('ghBranch').value.trim()||'main';
  var token=document.getElementById('ghToken').value.trim();
  if(!owner||!repo||!token){ alert('لازم تملأ اسم المستخدم واسم المستودع والتوكن.'); return; }
  var prev=JSON.parse(JSON.stringify(GH));
  GH={owner:owner,repo:repo,branch:branch,token:token};
  toast('جاري الاختبار...');
  fetch('https://api.github.com/repos/'+owner+'/'+repo, { headers:{'Authorization':'token '+token,'Accept':'application/vnd.github+json'} })
    .then(function(res){
      if(res.status===404) throw new Error('المستودع مش موجود، أو التوكن مالوش صلاحية عليه.');
      if(res.status===401) throw new Error('التوكن غلط أو منتهي.');
      if(!res.ok) throw new Error('فشل الاتصال (كود '+res.status+').');
      saveGh();
      toast('تم الاتصال بنجاح ✅');
      render();
    })
    .catch(function(e){ GH=prev; alert('فشل الاتصال:\n'+e.message); });
}
async function publishLive(){
  if(!confirm('هيتم نشر كل التعديلات على الموقع الحقيقي دلوقتي. تكمل؟')) return;
  toast('جاري النشر...');
  try{
    var dataStr = '/* ملف بيانات موقع ITQAN — آخر تحديث: '+new Date().toLocaleString('ar-EG')+' */\n'+
                  'window.SITE = '+JSON.stringify(D,null,2)+';\n';
    var existingData = await ghGetFile('data.js');
    await ghPutRaw('data.js', b64EncodeUnicode(dataStr), 'تحديث بيانات الموقع من لوحة التحكم', existingData?existingData.sha:null);

    var names=Object.keys(NEW_IMAGES);
    for(var i=0;i<names.length;i++){
      var name=names[i];
      var b64=await blobToBase64(NEW_IMAGES[name]);
      var existingImg=await ghGetFile(name).catch(function(){return null;});
      await ghPutRaw(name, b64, 'إضافة صورة جديدة: '+name, existingImg?existingImg.sha:null);
    }

    NEW_IMAGES={}; PREVIEWS={};
    ORIGINAL=JSON.parse(JSON.stringify(D));
    LS.del('itqan_draft');
    toast('تم النشر على الموقع 🎉');
    alert('تم نشر كل التعديلات على موقعك مباشرة.\nممكن تاخد شوية ثواني لحد ما تظهر — بعدها اعمل تحديث قوي (Ctrl+F5).');
    render();
  }catch(e){
    alert('حصل خطأ أثناء النشر:\n'+e.message+'\n\nتأكد إن التوكن لسه شغال وعنده صلاحية Contents: Read and write على المستودع، وحاول تاني.');
  }
}

function save(){ LS.set('itqan_draft', JSON.stringify(D));
  document.getElementById('draftNote').textContent = 'آخر تعديل: ' + new Date().toLocaleTimeString('ar-EG');
}
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.add('hidden');},2600); }
function resetDraft(){
  if(!confirm('هيتم إلغاء كل التعديلات غير المحفوظة والرجوع لآخر نسخة مرفوعة. تمام؟')) return;
  LS.del('itqan_draft'); D = JSON.parse(JSON.stringify(ORIGINAL)); NEW_IMAGES={}; render();
  toast('رجعنا للنسخة الأصلية');
}
function getP(path){ return path.split('.').reduce(function(o,k){ return o==null?o:o[k]; }, D); }
function setP(path, val){
  var ks=path.split('.'), o=D;
  for(var i=0;i<ks.length-1;i++) o=o[ks[i]];
  o[ks[ks.length-1]]=val; save();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function imgSrc(f){ return PREVIEWS[f] || f; }

/* ============ FIELD BUILDERS ============ */
function fText(path, label, hint){
  return '<div class="mb-4"><label class="lbl">'+esc(label)+(hint?' <span class="font-normal text-slate-400">'+esc(hint)+'</span>':'')+'</label>'+
    '<input class="inp" data-path="'+path+'" value="'+esc(getP(path))+'"/></div>';
}
function fArea(path, label, rows){
  return '<div class="mb-4"><label class="lbl">'+esc(label)+'</label>'+
    '<textarea class="inp resize-y" rows="'+(rows||3)+'" data-path="'+path+'">'+esc(getP(path))+'</textarea></div>';
}
function fSelect(path, label, opts){
  var v=getP(path);
  return '<div class="mb-4"><label class="lbl">'+esc(label)+'</label><select class="inp" data-path="'+path+'">'+
    opts.map(function(o){ return '<option value="'+esc(o[0])+'"'+(String(v)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')+
    '</select></div>';
}
function fImage(path, label){
  var f=getP(path);
  return '<div class="mb-4"><label class="lbl">'+esc(label)+'</label>'+
    '<div class="flex items-center gap-3">'+
      '<img src="'+esc(imgSrc(f))+'" class="w-20 h-20 rounded-xl object-cover border border-slate-200 bg-slate-100" onerror="this.style.opacity=.25"/>'+
      '<div class="flex-1 min-w-0">'+
        '<div class="text-xs text-slate-500 truncate mb-2" dir="ltr">'+esc(f)+(NEW_IMAGES[f]?' <span class="chip">جديدة</span>':'')+'</div>'+
        '<button class="btn btn-g text-xs" onclick="pickImage(\''+path+'\')">تغيير الصورة</button>'+
      '</div>'+
    '</div></div>';
}
/* simple string-array editor */
function fList(path, label, placeholder){
  var arr=getP(path)||[];
  return '<div class="mb-4"><label class="lbl">'+esc(label)+'</label><div class="space-y-2">'+
    arr.map(function(v,i){ return '<div class="flex gap-2">'+
      '<input class="inp" data-path="'+path+'.'+i+'" value="'+esc(v)+'" placeholder="'+esc(placeholder||'')+'"/>'+
      '<button class="btn btn-r px-3" onclick="delItem(\''+path+'\','+i+')">حذف</button></div>'; }).join('')+
    '</div><button class="btn btn-g text-xs mt-2" onclick="addItem(\''+path+'\',\'\')">+ إضافة سطر</button></div>';
}
function addItem(path, val){ getP(path).push(typeof val==='object'?JSON.parse(JSON.stringify(val)):val); save(); render(); }
function delItem(path, i){ if(!confirm('تأكيد الحذف؟')) return; getP(path).splice(i,1); save(); render(); }
function moveItem(path, i, dir){
  var a=getP(path), j=i+dir; if(j<0||j>=a.length) return;
  var t=a[i]; a[i]=a[j]; a[j]=t; save(); render();
}

/* ============ IMAGE PICKER + RESIZE ============ */
function pickImage(path){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=function(){
    var file=inp.files[0]; if(!file) return;
    toast('جاري ضغط الصورة...');
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var maxw=1600, w=im.width, h=im.height;
        if(w>maxw){ h=Math.round(h*maxw/w); w=maxw; }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        c.toBlob(function(blob){
          var name='images/img-'+Date.now()+'.jpg';
          NEW_IMAGES[name]=blob;
          PREVIEWS[name]=URL.createObjectURL(blob);
          setP(path,name); render();
          toast('تم — الصورة اتحفظت باسم '+name.replace('images/',''));
        },'image/jpeg',0.82);
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  };
  inp.click();
}

function addProject(){
  D.gallery.projects.unshift({image:'images/project-01.webp',title:'مشروع جديد',subtitle:'وصف المشروع',status:'done',width:'normal'});
  save(); render();
  setTimeout(function(){ pickImage('gallery.projects.0.image'); }, 150);
}

/* ============ RENDER ============ */
function render(){
  document.getElementById('tabs').innerHTML = TABS.map(function(t){
    return '<button class="tab'+(t[0]===CUR?' on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('');
  document.getElementById('panel').innerHTML = VIEWS[CUR]();
  var pb=document.getElementById('publishBtn');
  if(pb) pb.textContent = isGhConnected() ? '🚀 نشر على الموقع' : 'حفظ وتنزيل الملفات';
  window.scrollTo({top:0});
}
function go(t){ CUR=t; LS.set('itqan_tab',t); render(); }

document.addEventListener('input', function(e){
  var p=e.target.getAttribute('data-path'); if(!p) return;
  setP(p, e.target.value);
});
document.addEventListener('change', function(e){
  var p=e.target.getAttribute('data-path'); if(!p || e.target.tagName!=='SELECT') return;
  var v=e.target.value;
  setP(p, v==='true'?true : v==='false'?false : v);
  render();
});

/* ============ PUBLISH ============ */
function dl(blob, filename){
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function publishDownload(){
  var js='/* ملف بيانات موقع ITQAN — آخر تحديث: '+new Date().toLocaleString('ar-EG')+' */\n'+
         'window.SITE = '+JSON.stringify(D,null,2)+';\n';
  dl(new Blob([js],{type:'text/javascript;charset=utf-8'}), 'data.js');

  var names=Object.keys(NEW_IMAGES);
  names.forEach(function(n,i){
    setTimeout(function(){ dl(NEW_IMAGES[n], n.replace('images/','')); }, 700*(i+1));
  });

  var msg = names.length
    ? 'نزّلنا لك ملف data.js و'+names.length+' صورة جديدة.\n\nالخطوات:\n1) ارفع data.js في نفس مجلد index.html (استبدل القديم).\n2) ارفع الصور الجديدة جوه مجلد images.\n3) افتح الموقع واعمل تحديث (Ctrl+F5).\n\nملحوظة: تقدر من تبويب "🚀 النشر التلقائي" تربط لوحة التحكم بمستودع GitHub بتاعك عشان الزرار ده ينشر لوحده من غير ما تنزّل حاجة.'
    : 'نزّلنا لك ملف data.js.\n\nارفعه في نفس مجلد index.html مكان القديم، وبعدها افتح الموقع واعمل تحديث (Ctrl+F5).';
  setTimeout(function(){ alert(msg); }, 400);
  toast('تم التنزيل');
}
function publish(){
  if(isGhConnected()) publishLive();
  else publishDownload();
}

window.addEventListener('beforeunload', function(e){
  if(Object.keys(NEW_IMAGES).length){ e.preventDefault(); e.returnValue=''; }
});

if(LS.get('itqan_draft')) document.getElementById('draftNote').textContent='فيه تعديلات محفوظة لسه متنزلتش';
else document.getElementById('draftNote').textContent='جاهز';
if(LSg.get('itqan_admin_auth')==='1'){ render(); }
